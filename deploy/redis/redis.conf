# Starry Code Redis config — R1 hybrid persistence.
#
# Persistence: RDB + AOF + RDB-AOF hybrid preamble (Redis 4.0+).
# AOF rewrite uses RDB format for the bulk, so restart is O(RDB-load)
# not O(AOF-replay). ~10x faster for large session counts.

# RDB snapshots
save 60 1
save 300 10
save 900 1

# AOF — every write appended, fsync every second
appendonly yes
appendfsync everysec
# AOF rewrite uses RDB format for the bulk (Redis 4.0+ hybrid)
aof-use-rdb-preamble yes

# Memory (R3+ will tune; for now leave defaults)
# maxmemory 256mb
# maxmemory-policy allkeys-lru

# Networking — bind all interfaces (docker compose network)
bind 0.0.0.0
protected-mode no

# Logging — only errors to stdout
loglevel notice

# Slow log
slowlog-log-slower-than 10000
slowlog-max-len 128
